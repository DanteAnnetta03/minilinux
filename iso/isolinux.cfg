UI menu.c32
PROMPT 0
TIMEOUT 50
DEFAULT minilinux

MENU TITLE  MiniLinux 2.0
MENU AUTOBOOT Starting in # second{,s}...

# Colores del menu (fg bg + sombra)
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #ffffffff #a0000000 std
MENU COLOR sel          7;37;40 #e0ffffff #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #00000000 std
MENU COLOR timeout_msg  37;40   #80ffffff #00000000 std
MENU COLOR timeout      1;37;40 #c0ffffff #00000000 std
MENU COLOR msg07        37;40   #90ffffff #a0000000 std
MENU COLOR tabmsg       31;40   #30ffffff #00000000 std

LABEL minilinux
    MENU LABEL ^MiniLinux 2.0 (normal boot)
    KERNEL /isolinux/bzImage
    INITRD /isolinux/rootfs.cpio.xz
    APPEND rdinit=/sbin/init console=tty0 console=ttyS0,115200 vga=788 quiet

LABEL debug
    MENU LABEL MiniLinux 2.0 (^debug - verbose kernel log)
    KERNEL /isolinux/bzImage
    INITRD /isolinux/rootfs.cpio.xz
    APPEND rdinit=/sbin/init console=tty0 console=ttyS0,115200 vga=788 loglevel=8 earlyprintk=serial,ttyS0,115200 debug

LABEL serial
    MENU LABEL MiniLinux 2.0 (^serial only - ttyS0 as main)
    KERNEL /isolinux/bzImage
    INITRD /isolinux/rootfs.cpio.xz
    APPEND rdinit=/sbin/init console=ttyS0,115200 console=tty0 quiet
